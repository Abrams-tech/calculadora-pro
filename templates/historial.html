<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Operaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

    <nav class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-indigo-600">Calculadora<span class="text-slate-800">Pro</span></a>
            <div class="flex items-center gap-4">
                <a href="/" class="text-slate-600 hover:text-indigo-600 font-medium transition">Panel Principal</a>
                <a href="/logout" class="text-sm text-red-500 hover:text-red-700 font-medium transition">Salir</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-bold mb-6">Registro de Consultas Previas</h2>
        <div class="space-y-4">
            {% if registros %}
                {% for r in registros %}
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <span class="text-xs font-semibold uppercase text-indigo-600 bg-indigo-50 px-2 py-1 rounded">Cálculo Exitoso</span>
                        <h3 class="font-medium text-slate-700 mt-2 text-sm">{{ r.problema }}</h3>
                    </div>
                    <div class="bg-slate-50 px-4 py-2 rounded border border-slate-100 w-full md:w-1/2 overflow-x-auto math-item text-sm">
                        {{ r.resultado }}
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="text-center py-12 bg-white rounded-xl border border-dashed border-slate-200">
                    <p class="text-slate-400 mb-4">No se registran transacciones operacionales aún.</p>
                    <a href="/" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg text-sm transition">Volver</a>
                </div>
            {% endif %}
        </div>
    </main>

    <script>
        document.querySelectorAll('.math-item').forEach(el => {
            const formula = el.textContent.trim();
            katex.render(formula, el, { throwOnError: false, displayMode: true });
        });
    </script>
</body>
</html>
